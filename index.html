<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1420"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg">
<title>رَسا | پیام‌رسان</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">
<header class="top"><div class="brand"><img class="logo" src="icon-192.png" alt="رَسا"><div><b>رَسا</b><small>پیام‌رسان</small></div></div><div id="topActions" class="top-actions"></div></header>
<main id="authView" class="auth-view"><section class="auth-card"><img class="big-logo" src="icon-192.png" alt="رَسا"><h1>به رَسا خوش آمدی</h1><p>با شماره موبایل وارد شو یا حساب بساز.</p><label>شماره موبایل</label><input id="phone" inputmode="tel" placeholder="09xxxxxxxxx" autocomplete="tel"><button id="sendOtp" class="primary">ارسال کد ورود</button><div id="otpBox" class="hidden"><label>کد پیامک‌شده</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="کد ۶ رقمی"><button id="verifyOtp" class="primary">تأیید و ورود</button></div><div id="authStatus" class="hint"></div><p class="footnote">ورود با پیامک، وابسته به فعال بودن سرویس پیامک در تنظیمات سرور است.</p></section></main>
<main id="mainView" class="main-view hidden"><aside class="sidebar"><div class="me-row"><div id="myAvatar" class="avatar">م</div><div><b id="myName">حساب من</b><small id="myPhone"></small></div><button id="enableNotifications" class="icon-btn" title="فعال‌کردن اعلان">🔔</button><button id="uploadAvatar" class="icon-btn" title="تغییر عکس پروفایل">📷</button><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp" hidden><button id="editProfile" class="icon-btn" title="ویرایش پروفایل">✎</button><button id="logout" class="icon-btn" title="خروج">↪</button></div><div class="search-row"><input id="searchPhone" placeholder="جستجو با شماره موبایل"><button id="searchUser">+</button></div><div id="searchResult" class="search-result"></div><div class="tabs"><button class="tab active" data-tab="chats">گفتگوها</button><button class="tab" data-tab="contacts">مخاطب</button><button id="myCloud" class="tab cloud-tab">☁ ابرک من</button><button id="newGroup" class="tab">＋ گروه</button><button id="newChannel" class="tab">＋ کانال</button></div><div id="chatList" class="chat-list"></div></aside>
<section class="chat-area"><div id="emptyChat" class="empty"><img class="empty-logo" src="icon-192.png" alt="رَسا"><h2>رَسا</h2><p>یک گفتگوی امن و خصوصی را شروع کن.</p></div><div id="chatPane" class="hidden chat-pane"><header class="chat-header"><button id="backToList" class="icon-btn mobile-only">←</button><div id="chatAvatar" class="avatar">ر</div><div class="chat-head-text"><b id="chatTitle">گفتگو</b><small id="chatPresence"> </small></div><button id="audioCall" class="icon-btn" title="تماس صوتی">📞</button><button id="videoCall" class="icon-btn" title="تماس تصویری">📹</button><button id="searchMessages" class="icon-btn" title="جستجو در پیام‌ها">⌕</button><button id="showPins" class="icon-btn" title="پیام‌های سنجاق‌شده">📌</button><button id="chatInfo" class="icon-btn">⋮</button></header><div id="messages" class="messages"></div><div id="editNotice" class="edit-notice hidden">در حال ویرایش پیام <button id="cancelEdit">×</button></div><div id="replyNotice" class="edit-notice hidden">پاسخ به: <span id="replyNoticeText"></span><button id="cancelReply">×</button></div><form id="sendForm" class="composer"><label class="attach" title="ارسال فایل">＋<input id="fileInput" type="file" hidden></label><button id="stickers" type="button" class="voice-btn" title="استیکر">☺</button><button id="recordVoice" type="button" class="voice-btn" title="ضبط پیام صوتی">🎙</button><button id="shareLocation" type="button" class="voice-btn" title="ارسال موقعیت فعلی">📍</button><textarea id="messageInput" rows="1" placeholder="پیام بنویس…"></textarea><button id="sendButton" class="send">➤</button></form></div></section></main>
</div><div id="callOverlay" class="call-overlay hidden"></div><div id="toast" class="toast"></div>
<script src="app.js"></script>
</body></html>

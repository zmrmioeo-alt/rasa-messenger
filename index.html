<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1320"><title>رَسا | پیام‌رسان</title>
<style>
:root{--bg:#0b1320;--panel:#111d2d;--panel2:#162438;--line:#22354d;--text:#edf4ff;--muted:#91a6bf;--accent:#57d6c5;--accent2:#7da9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0,#14263a 0,transparent 50%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{max-width:1250px;margin:auto;height:100dvh;min-height:570px;padding:16px;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.brand{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border-radius:15px;background:linear-gradient(145deg,#62dfd0,#3c9ce7);display:grid;place-items:center;color:#0a1925;font-weight:900;font-size:23px;box-shadow:0 8px 30px #46b9c144}.brand b{font-size:20px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.topbadge{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:8px 11px;border-radius:99px}.layout{display:grid;grid-template-columns:350px 1fr;gap:12px;flex:1;min-height:0}.sidebar,.chat{border:1px solid var(--line);background:#101c2aee;border-radius:22px;overflow:hidden}.sidebar{display:flex;flex-direction:column}.user{display:flex;align-items:center;gap:10px;padding:17px;border-bottom:1px solid var(--line)}.avatar{width:44px;height:44px;flex-shrink:0;border-radius:16px;background:linear-gradient(135deg,#4a8fd6,#3dc8b4);display:grid;place-items:center;color:#081b28;font-weight:bold}.user .info{flex:1}.user b{font-size:14px}.user small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.search{padding:12px}.search input{width:100%;background:#0b1522;border:1px solid var(--line);color:white;border-radius:12px;padding:12px;outline:none}.tabs{display:flex;gap:6px;padding:0 12px 12px}.tabs button{flex:1;padding:10px 4px;background:#162438;color:var(--muted);border-radius:11px;font-size:12px}.tabs button.active{background:#23445a;color:#a8f0e6}.list{overflow:auto;flex:1;padding:0 8px 8px}.item{display:flex;align-items:center;gap:11px;padding:11px;border-radius:14px;cursor:pointer}.item:hover,.item.active{background:#1a2c41}.item .details{min-width:0;flex:1}.item b{font-size:13px}.item p{margin:5px 0 0;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:var(--muted)}.land{margin:10px;padding:14px;border:1px solid #2b655f;border-radius:15px;background:linear-gradient(120deg,#173b42,#17273d);display:flex;align-items:center;gap:10px}.land .cloud{font-size:24px}.land b{font-size:13px}.land small{display:block;color:#a9d8d2;margin-top:4px;font-size:10px}.chat{display:flex;flex-direction:column;position:relative}.chat-head{height:70px;padding:12px 17px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.headtext{flex:1}.headtext b{font-size:14px}.headtext small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.icon{background:#17263a;border:1px solid var(--line);width:38px;height:38px;border-radius:12px}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;background-image:radial-gradient(#25384b55 1px,transparent 1px);background-size:20px 20px}.bubble{max-width:min(76%,460px);padding:11px 13px;border-radius:15px;background:#1b2a3e;border:1px solid #263c54;font-size:13px;line-height:1.9}.bubble.mine{align-self:flex-start;background:#16433f;border-color:#26665e;border-bottom-left-radius:5px}.bubble:not(.mine){align-self:flex-end;border-bottom-right-radius:5px}.bubble small{display:block;text-align:left;color:#a8c0d4;font-size:10px;margin-top:3px}.welcome{margin:auto;text-align:center;color:var(--muted)}.welcome .big{font-size:55px;margin-bottom:12px}.welcome h2{color:var(--text);margin:8px}.welcome p{font-size:13px}.composer{display:flex;align-items:center;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer input{flex:1;min-width:0;background:#0b1522;border:1px solid var(--line);border-radius:13px;color:white;padding:13px;outline:none}.send{width:43px;height:43px;border-radius:14px;background:var(--accent);color:#09212b;font-size:18px;font-weight:bold}.modal{position:absolute;inset:0;background:#06101ccc;display:none;place-items:center;padding:20px}.modal.open{display:grid}.modalbox{width:min(400px,100%);padding:22px;background:#152438;border:1px solid var(--line);border-radius:20px}.modalbox h3{margin-top:0}.modalbox p{color:var(--muted);line-height:1.8;font-size:13px}.modalbox button{padding:11px 15px;background:#214257;border-radius:12px;margin:4px}.mobile-menu{display:none}.emptyline{text-align:center;color:var(--muted);padding:25px;font-size:12px}
@media(max-width:750px){.app{padding:8px}.top{height:56px;padding:0 7px}.layout{grid-template-columns:1fr}.sidebar{display:flex}.chat{display:none}.layout.chat-open .sidebar{display:none}.layout.chat-open .chat{display:flex}.mobile-menu{display:inline-block}.topbadge{font-size:10px}.bubble{max-width:86%}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">ر</div><div><b>رَسا</b><small>پیام‌رسان فارسی</small></div></div><div class="topbadge">پیش‌نمایش تعاملی · نسخه آزمایشی</div></header><main class="layout" id="layout"><aside class="sidebar"><div class="user"><div class="avatar">م</div><div class="info"><b>کاربر آزمایشی</b><small>حساب پیش‌نمایش</small></div><button class="icon" onclick="modal('حساب آزمایشی','این صفحه فقط پیش‌نمایش رابط رَساست. ورود و حساب واقعی هنوز فعال نیست.')">⚙</button></div><div class="search"><input id="search" placeholder="جستجو در گفتگوها…" oninput="filterChats()"></div><div class="tabs"><button class="active" onclick="setTab(this,'همه')">همه</button><button onclick="setTab(this,'خصوصی')">خصوصی</button><button onclick="setTab(this,'گروه')">گروه‌ها</button></div><div class="list" id="list"></div><div class="land" onclick="openLand()"><span class="cloud">☁️</span><div><b>رَسا‌لند</b><small>بازی‌ها، مأموریت‌ها و امکانات ویژه</small></div><span>←</span></div></aside><section class="chat"><header class="chat-head"><button class="icon mobile-menu" onclick="backList()">←</button><div class="avatar" id="headAvatar">ر</div><div class="headtext"><b id="headName">رَسا</b><small id="headStatus">فضای گفتگو</small></div><button class="icon" onclick="modal('جستجو','جستجوی پیام‌ها در نسخه پیش‌نمایش هنوز فعال نیست.')">⌕</button><button class="icon" onclick="modal('جزئیات','نمایش جزئیات گفتگو در نسخه آزمایشی.')">⋮</button></header><div class="messages" id="messages"><div class="welcome"><div class="big">💬</div><h2>به رَسا خوش آمدی</h2><p>برای دیدن گفتگو، یکی از موارد فهرست را انتخاب کن.</p></div></div><form class="composer" onsubmit="send(event)"><button type="button" class="icon" onclick="modal('پیوست','ارسال فایل در این پیش‌نمایش غیرفعال است.')">＋</button><input id="message" placeholder="پیام بنویس…" autocomplete="off"><button class="send">➤</button></form></section><div class="modal" id="modal"><div class="modalbox"><h3 id="modalTitle"></h3><p id="modalText"></p><button onclick="closeModal()">باشه</button></div></div></main></div>
<script>
const chats=[{id:1,name:'آرمان',type:'خصوصی',avatar:'آ',status:'آنلاین',last:'سلام، خوبی؟',messages:[['سلام! 👋','آرمان',false],['سلام، خوبی؟','من',true],['خوبم، ممنون. رَسا رو دیدی؟','آرمان',false]]},{id:2,name:'گروه برنامه‌نویسی',type:'گروه',avatar:'💻',status:'۱۲ عضو',last:'امروز درباره پروژه صحبت کنیم',messages:[['سلام بچه‌ها، نسخه جدید آماده‌ست؟','سارا',false],['امروز درباره پروژه صحبت کنیم','من',true]]},{id:3,name:'خانواده',type:'گروه',avatar:'🏡',status:'۵ عضو',last:'عکس‌ها رو فرستادم',messages:[['عکس‌ها رو فرستادم','مادر',false]]},{id:4,name:'کانال رَسا',type:'کانال',avatar:'📣',status:'کانال',last:'به رَسا خوش آمدید',messages:[['به رَسا خوش آمدید؛ اینجا خبرهای تازه منتشر می‌شود.','رَسا',false]]}];let active=null,tab='همه';function renderList(){const q=document.getElementById('search').value.toLowerCase();let filtered=chats.filter(c=>(tab==='همه'||c.type===tab)&&(`${c.name} ${c.last}`).toLowerCase().includes(q));document.getElementById('list').innerHTML=filtered.map(c=>`<div class="item ${active?.id===c.id?'active':''}" onclick="openChat(${c.id})"><div class="avatar">${c.avatar}</div><div class="details"><b>${c.name}</b><p>${c.last}</p></div><span class="time">${c.type==='گروه'?'گروه':''}</span></div>`).join('')||'<div class="emptyline">نتیجه‌ای پیدا نشد.</div>'}function filterChats(){renderList()}function setTab(btn,t){tab=t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderList()}function openChat(id){active=chats.find(c=>c.id===id);renderList();document.getElementById('headName').textContent=active.name;document.getElementById('headStatus').textContent=active.status;document.getElementById('headAvatar').textContent=active.avatar;document.getElementById('messages').innerHTML=active.messages.map(m=>bubble(m[0],m[1]==='من')).join('');document.getElementById('layout').classList.add('chat-open');document.getElementById('messages').scrollTop=999999}function bubble(text,mine){return `<div class="bubble ${mine?'mine':''}">${escapeHTML(text)}<small>${mine?'من':' '}${new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}</small></div>`}function send(e){e.preventDefault();const input=document.getElementById('message');const val=input.value.trim();if(!val)return;if(!active){modal('گفتگو انتخاب نشده','ابتدا یکی از گفتگوها را انتخاب کن.');return}active.messages.push([val,'من',true]);active.last=val;input.value='';openChat(active.id);renderList()}function backList(){document.getElementById('layout').classList.remove('chat-open')}function openLand(){modal('☁️ رَسا‌لند','این بخش در حال ساخت است. ایده اولیه: بازی‌های کوچک، مأموریت روزانه، امتیاز و دستاورد، ساخت استیکر و ابزارهای کاربردی.')}function modal(t,p){document.getElementById('modalTitle').textContent=t;document.getElementById('modalText').textContent=p;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}renderList();
</script></body></html>
